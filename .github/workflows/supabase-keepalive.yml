# 변기요 Supabase 무료 프로젝트가 7일 동안 쓰이지 않으면 일시 정지되므로,
# 사흘마다 공개 별점 뷰를 한 번 읽어 깨워 둡니다.
# URL 과 publishable 키는 앱에도 들어 있는 공개용 값이고, 데이터는 접근 규칙(RLS)이 지킵니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *" # 사흘마다 03:17 UTC (한국 12:17)
  workflow_dispatch: # Actions 탭에서 직접 실행할 수도 있습니다

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: https://pswjcuskpwnqtplmfqjn.supabase.co
          SUPABASE_KEY: sb_publishable_2nEnD_W68Edvsw78QP_Evg_-nOWmqso
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/restroom_ratings?select=restroom_id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase 응답: $status"
          test "$status" = "200"
